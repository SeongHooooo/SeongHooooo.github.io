<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-POP 여자 연예인 분류기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f1f9ff;
    --card: #ffffff;
    --pink: #5cb8f0;
    --pink-soft: #dff2ff;
    --peach: #a8dcfa;
    --mint: #d6f1f5;
    --text: #3f5365;
    --muted: #7f93a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 56px;
    font-family: "Jua", "Malgun Gothic", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 10% 8%, var(--pink-soft) 0 90px, transparent 91px),
      radial-gradient(circle at 92% 20%, #e6f7fb 0 70px, transparent 71px),
      radial-gradient(circle at 85% 92%, #e4f0ff 0 100px, transparent 101px),
      var(--bg);
    min-height: 100vh;
  }
  main { max-width: 560px; margin: 0 auto; text-align: center; }
  .mascots { font-size: 2.6rem; letter-spacing: .2em; }
  h1 { font-size: 1.9rem; margin: 8px 0 6px; }
  h1 span { color: var(--pink); }
  .sub { color: var(--muted); margin: 0 0 24px; }

  .card {
    background: var(--card); border-radius: 28px; padding: 24px 20px;
    box-shadow: 0 8px 24px rgba(92, 184, 240, .18);
  }
  #file { display: none; }
  .drop {
    display: block; cursor: pointer; padding: 28px 16px;
    border: 3px dashed var(--pink); border-radius: 22px; background: var(--pink-soft);
    transition: transform .15s, background .15s;
  }
  .drop:hover { transform: translateY(-2px) scale(1.01); background: #c9e8fc; }
  .drop .big { font-size: 2.2rem; display: block; }
  .drop .btn {
    display: inline-block; margin-top: 10px; padding: 10px 24px;
    background: var(--pink); color: #fff; border-radius: 999px; font-size: 1.05rem;
  }
  .hint { font-size: .85rem; color: var(--muted); margin: 12px 0 0; }

  #face-image {
    max-width: 100%; max-height: 340px; display: block; margin: 20px auto 0;
    border-radius: 24px; border: 6px solid var(--peach);
    box-shadow: 0 6px 16px rgba(168, 220, 250, .55);
  }
  #result-title { font-size: 1.7rem; margin: 18px 0 4px; color: var(--pink); }
  #result-explain { color: var(--text); font-size: 1.1rem; }
  #bars { margin-top: 18px; text-align: left; }
  .bar { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .bar > span:first-child { width: 4.5em; text-align: right; }
  .bar > span:last-child { width: 3em; color: var(--muted); }
  .bar > div {
    height: 16px; min-width: 6px; border-radius: 999px;
    background: linear-gradient(90deg, var(--pink), var(--peach));
    transition: width .5s ease;
  }
  footer { margin-top: 20px; font-size: .8rem; color: var(--muted); }
</style></head>
<body>
<main>
  <div class="mascots">👩🧑👧</div>
  <h1>K-POP <span>여자 연예인</span> 분류기</h1>
  <p class="sub">사진을 올리면 누구와 닮았는지 맞춰 볼게요!</p>

  <div class="card">
    <label class="drop" for="file">
      <span class="big">📷</span>
      사진을 여기에 골라 주세요
      <br><span class="btn">사진 선택하기</span>
    </label>
    <input type="file" id="file" accept="image/*">
    <p class="hint">사진은 내 브라우저에서만 분석되고 저장되지 않아요 🔒</p>

    <img id="face-image" alt="" hidden>
    <div id="result-title"></div>
    <div id="result-explain"></div>
    <div id="bars"></div>
  </div>
  <footer>재미로 보는 AI 테스트예요 💖</footer>
</main>

<!-- Teachable Machine 이미지 모델 라이브러리 -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // ① 모델 폴더: model.json, metadata.json, weights.bin 이 들어 있는 폴더 (이 파일 기준 상대 경로)
  const MODEL_URL = "./mltest_files/";

  // ② 클래스 설명: Teachable Machine 에서 정한 클래스 이름을 그대로 쓰고, 설명만 바꾸면 된다.
  const dic_class2information = {
    "나연": "트와이스 나연",
    "장원영": "아이브 장원영",
    "제니": "블랙핑크 제니"
  };

  let model;
  const img = document.getElementById("face-image");

  async function loadModel() {
    model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
  }

  async function predict() {
    const prediction = await model.predict(img, false);
    prediction.sort((a, b) => b.probability - a.probability);
    const top = prediction[0];
    document.getElementById("result-title").textContent =
      top.className + " (" + (top.probability * 100).toFixed(0) + "%)";
    document.getElementById("result-explain").textContent =
      dic_class2information[top.className] || "설명 없음";
    document.getElementById("bars").innerHTML = prediction.map(p =>
      `<div class="bar"><span>${p.className}</span><div style="width:${(p.probability * 100).toFixed(0)}%"></div>` +
      `<span>${(p.probability * 100).toFixed(0)}%</span></div>`).join("");
  }

  document.getElementById("file").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    if (!model) await loadModel();
    img.onload = predict;
    img.src = URL.createObjectURL(f);
    img.hidden = false;
  });
</script>
</body></html>
